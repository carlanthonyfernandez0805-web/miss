<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gumball Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column. Top bar (back link, theme button), a title, then the machine on the left and the result card on the right. They stack on phones. */
:root {
  --bg: #FFF1EE;
  --surface: #FFFFFF;
  --fg: #3A1F2D;
  --muted: #75525F;
  --accent: #D63A62;
  --accent-ink: #FFFFFF;
  --line: #F3D3D6;
  --tint: #FFE4E8;
  --glow: rgba(214, 58, 98, 0.28);
  --m-body: #F2658A;
  --m-rim: #D63A62;
  --m-dark: #7A2340;
  --glass: rgba(255, 255, 255, 0.55);
  --ground: rgba(58, 31, 45, 0.14);
  --font-display: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'DM Mono', ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C0A1C; --surface: #17132E; --fg: #F2EDFF; --muted: #A99FCB;
    --accent: #FF3FA8; --accent-ink: #14041C; --line: #2E2757; --tint: #221B45;
    --glow: rgba(255, 63, 168, 0.35);
    --m-body: #2B1F63; --m-rim: #FF3FA8; --m-dark: #0C0A1C;
    --glass: rgba(124, 245, 233, 0.1); --ground: rgba(0, 0, 0, 0.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C0A1C; --surface: #17132E; --fg: #F2EDFF; --muted: #A99FCB;
  --accent: #FF3FA8; --accent-ink: #14041C; --line: #2E2757; --tint: #221B45;
  --glow: rgba(255, 63, 168, 0.35);
  --m-body: #2B1F63; --m-rim: #FF3FA8; --m-dark: #0C0A1C;
  --glass: rgba(124, 245, 233, 0.1); --ground: rgba(0, 0, 0, 0.45);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font: 400 1rem/1.6 var(--font-body);
  padding-inline: clamp(16px, 4vw, 32px);
  overflow-x: hidden;
  transition: background 0.4s, color 0.4s;
}
h1, h2, p { margin: 0; }
h1 { font: 800 clamp(2.6rem, 11vw, 5.2rem)/1 var(--font-display); letter-spacing: -0.04em; text-wrap: balance; }
h2 { font: 750 clamp(1.7rem, 5vw, 2.3rem)/1.05 var(--font-display); letter-spacing: -0.03em; text-wrap: balance; }
:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
button { font-family: inherit; }

.wrap { max-width: 960px; margin-inline: auto; padding-block: 20px 64px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.pill {
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
  font: 700 0.95rem/1 var(--font-body); color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 12px 18px;
}
.round-btn {
  width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
  background: var(--surface); color: var(--fg); border: 1px solid var(--line);
}
.round-btn svg { width: 22px; height: 22px; }
body[data-mode="dark"] .i-sun, body:not([data-mode="dark"]) .i-moon { display: none; }
.head { display: grid; gap: 10px; }
.sub { color: var(--muted); max-width: 40ch; }

.stage { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: clamp(24px, 5vw, 56px); align-items: start; }
@media (max-width: 800px) { .stage { grid-template-columns: minmax(0, 1fr); justify-items: center; } .result { justify-self: stretch; } }
.machine-col { display: grid; gap: 16px; justify-items: center; width: 100%; max-width: 340px; }
#machine { width: 100%; height: auto; display: block; overflow: visible; }
#machine .click { cursor: pointer; }
.status { min-height: 3em; text-align: center; color: var(--muted); font-size: 0.95rem; max-width: 30ch; }
.btn {
  font: 700 1.05rem/1 var(--font-body); background: var(--accent); color: var(--accent-ink);
  border: 0; border-radius: 999px; padding: 18px 28px; cursor: pointer; box-shadow: 0 8px 24px var(--glow);
  transition: transform 0.15s;
}
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: scale(0.98); }
.btn[disabled] { opacity: 0.55; cursor: default; transform: none; }
.btn.link { display: inline-block; text-decoration: none; font-size: 0.95rem; padding: 14px 22px; }

.shelf { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.shelf li {
  display: inline-flex; align-items: center; gap: 8px; font: 500 0.8rem/1 var(--font-mono);
  background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 9px 12px; color: var(--muted);
}
.shelf .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--line); flex: none; }
.shelf li.found { color: var(--fg); }
.count { font: 500 0.8rem/1 var(--font-mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); text-align: center; }

.result {
  display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 20px; align-items: start;
  background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: clamp(18px, 4vw, 28px);
  box-shadow: 0 14px 40px var(--glow);
}
@media (max-width: 480px) { .result { grid-template-columns: minmax(0, 1fr); } }
.result .art { width: 96px; height: 96px; border-radius: 20px; display: block; }
.result .body { display: grid; gap: 10px; min-width: 0; justify-items: start; }
.tag { font: 500 0.75rem/1.3 var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.song { font: 700 1.2rem/1.2 var(--font-display); overflow-wrap: anywhere; }
.song::before { content: 'Song: '; font: 500 0.8rem/1 var(--font-mono); color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.blurb { max-width: 46ch; }
.result.show { animation: rise 0.5s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.placeholder {
  background: var(--tint); border-radius: 24px; padding: 28px; color: var(--muted); max-width: 40ch;
  font: 600 1.15rem/1.4 var(--font-display);
}

.ball-wait { transform-box: fill-box; transform-origin: center; animation: tapme 1.1s ease-in-out infinite; }
@keyframes tapme { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.half { transform-box: fill-box; transform-origin: center; }

@media (prefers-reduced-motion: reduce) {
  .ball-wait { animation: none; }
  .result.show { animation: none; }
  * { transition-duration: 0.01ms !important; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="a-bita" viewBox="0 0 64 64">
      <rect width="64" height="64" fill="#FFC857"/>
      <path d="M0 50q16-8 32-2t32-4v20H0z" fill="#F29E4C"/>
      <ellipse cx="22" cy="24" rx="12" ry="7" fill="#fff" fill-opacity=".75" transform="rotate(-25 22 24)"/>
      <ellipse cx="42" cy="24" rx="12" ry="7" fill="#fff" fill-opacity=".75" transform="rotate(25 42 24)"/>
      <ellipse cx="32" cy="34" rx="8" ry="11" fill="#3A1F2D"/>
      <circle cx="29" cy="30" r="1.6" fill="#fff"/><circle cx="35" cy="30" r="1.6" fill="#fff"/>
      <path d="M26 38h12M27 43h10" stroke="#FFC857" stroke-width="2.2" stroke-linecap="round"/>
    </symbol>
    <symbol id="a-unique" viewBox="0 0 64 64">
      <rect width="64" height="64" fill="#2B1A63"/>
      <path d="M32 0v14" stroke="#B8A8E8" stroke-width="2"/>
      <circle cx="32" cy="34" r="20" fill="#E6E0FF"/>
      <path d="M12 34h40M32 14v40M17 22q15 8 30 0M17 46q15-8 30 0M22 17q-6 17 0 34M42 17q6 17 0 34" stroke="#9A8CE0" stroke-width="1.4" fill="none"/>
      <circle cx="24" cy="26" r="4" fill="#fff" fill-opacity=".8"/>
      <path d="M52 10l1.4 3.2 3.4.4-2.6 2.3.7 3.3-2.9-1.7-2.9 1.7.7-3.3-2.6-2.3 3.4-.4z" fill="#FF6B9A"/>
      <path d="M9 52l1 2.3 2.4.3-1.8 1.6.5 2.4-2.1-1.2-2.1 1.2.5-2.4-1.8-1.6 2.4-.3z" fill="#7CF5E9"/>
    </symbol>
    <symbol id="a-shire" viewBox="0 0 64 64">
      <rect width="64" height="64" fill="#F4E4F7"/>
      <path d="M32 32m-22 0a22 22 0 1 0 44 0a22 22 0 1 0-44 0" fill="none" stroke="#C9A6E8" stroke-width="2" stroke-dasharray="3 5"/>
      <g fill="#7A4FB5">
        <ellipse cx="32" cy="12" rx="4.5" ry="7" transform="rotate(8 32 12)"/>
        <ellipse cx="52" cy="32" rx="4.5" ry="7" transform="rotate(98 52 32)"/>
        <ellipse cx="32" cy="52" rx="4.5" ry="7" transform="rotate(188 32 52)"/>
        <ellipse cx="12" cy="32" rx="4.5" ry="7" transform="rotate(278 12 32)"/>
      </g>
      <circle cx="32" cy="32" r="3" fill="#E8618A"/>
    </symbol>
  </defs>
</svg>

<main class="wrap">
  <div class="top">
    <a class="pill" id="back" href="index.html">&larr; Back</a>
    <button class="round-btn" id="theme" type="button" aria-label="Switch between day and night">
      <svg class="i-sun" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" fill="none"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>

  <header class="head">
    <h1>Gumball machine</h1>
    <p class="sub">Turn the knob. Every gumball is a song I like.</p>
  </header>

  <section class="stage" aria-label="Gumball game">
    <div class="machine-col">
      <svg id="machine" viewBox="0 0 320 460" role="img" aria-label="A gumball machine full of colorful gumballs">
        <ellipse cx="160" cy="440" rx="120" ry="10" fill="var(--ground)"/>
        <rect x="84" y="418" width="26" height="14" rx="5" fill="var(--m-dark)"/>
        <rect x="210" y="418" width="26" height="14" rx="5" fill="var(--m-dark)"/>
        <path d="M70 258h180v146a16 16 0 0 1-16 16H86a16 16 0 0 1-16-16z" fill="var(--m-body)"/>

        <g id="dome">
          <circle cx="160" cy="146" r="104" fill="var(--glass)"/>
          <g id="balls"></g>
          <circle cx="160" cy="146" r="104" fill="none" stroke="var(--m-rim)" stroke-width="5"/>
          <path d="M92 104a82 82 0 0 1 38-40" stroke="#fff" stroke-opacity=".75" stroke-width="7" stroke-linecap="round" fill="none"/>
        </g>
        <rect x="62" y="240" width="196" height="26" rx="12" fill="var(--m-rim)"/>
        <rect x="136" y="28" width="48" height="20" rx="9" fill="var(--m-rim)"/>

        <rect x="124" y="274" width="72" height="22" rx="11" fill="var(--m-dark)"/>
        <text x="160" y="289.5" text-anchor="middle" font-family="DM Mono, ui-monospace, monospace" font-size="12" font-weight="500" letter-spacing="2" fill="#fff">ROLL</text>

        <g id="knob" class="click" style="transform-box: view-box; transform-origin: 160px 328px;">
          <circle cx="160" cy="328" r="30" fill="var(--m-rim)"/>
          <circle cx="160" cy="328" r="22" fill="var(--m-dark)" fill-opacity=".35"/>
          <rect x="130" y="322" width="60" height="12" rx="6" fill="#fff"/>
          <circle cx="160" cy="328" r="5" fill="var(--m-rim)"/>
        </g>

        <rect x="120" y="364" width="80" height="46" rx="12" fill="var(--m-dark)"/>
        <g transform="translate(160 388)">
          <g id="dropBall" class="click" style="opacity:0">
            <g id="halfBot" class="half"><path d="M-15 0a15 15 0 0 0 30 0z" id="botPath" fill="#FFC857"/></g>
            <g id="halfTop" class="half"><path d="M-15 0a15 15 0 0 1 30 0z" id="topPath" fill="#FFC857"/><circle cx="-5" cy="-7" r="3.6" fill="#fff" fill-opacity=".6"/></g>
          </g>
        </g>
      </svg>

      <button class="btn" id="main" type="button">Turn the knob</button>
      <p class="status" id="status" aria-live="polite">Tap the button or the knob to roll.</p>
      <p class="count" id="count">Found 0 of 3</p>
      <ul class="shelf" id="shelf"></ul>
    </div>

    <div>
      <p class="placeholder" id="placeholder">Your song shows up here after you open a gumball.</p>
      <article class="result" id="result" hidden aria-live="polite">
        <svg class="art" viewBox="0 0 64 64" aria-hidden="true"><use id="rArt" href="#a-bita"></use></svg>
        <div class="body">
          <p class="tag" id="rTag"></p>
          <h2 id="rArtist"></h2>
          <p class="song" id="rSong"></p>
          <p class="blurb" id="rBlurb"></p>
          <a class="btn link" id="rLink" href="#" target="_blank" rel="noopener">Search on YouTube</a>
        </div>
      </article>
    </div>
  </section>
</main>

<script>
(function () {
  var root = document.documentElement;
  var body = document.body;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var mq = window.matchMedia('(prefers-color-scheme: dark)');

  /* ---------- Picks: edit this list ---------- */
  var PICKS = [
    {
      artist: 'Bita and the Botflies', song: 'Quiapo', color: '#FFC857', art: 'a-bita',
      tag: 'My recommendation',
      blurb: 'A local band I recommend. Start with Quiapo and see if it grabs you too.',
      link: 'https://www.youtube.com/results?search_query=Bita+and+the+Botflies+Quiapo'
    },
    {
      artist: 'Unique Salonga', song: 'Ozone', color: '#FF6B9A', art: 'a-unique',
      tag: 'My favorite local band. Super underrated.',
      blurb: 'Ozone is about the Ozone Disco fire. I watched a documentary about it for our midterms and it was super interesting.',
      link: 'https://www.youtube.com/results?search_query=Unique+Salonga+Ozone'
    },
    {
      artist: 'Shirebound', song: 'Waltz of 4 Left Feet', color: '#B79CF2', art: 'a-shire',
      tag: 'My recommendation',
      blurb: 'Aninipot. Intro pa lang, busog na tenga mo.',
      link: 'https://www.youtube.com/results?search_query=Waltz+of+4+Left+Feet+Shirebound'
    }
  ];

  /* ---------- Theme ---------- */
  var h = (location.hash || '').slice(1);
  if (h === 'dark' || h === 'light') root.setAttribute('data-theme', h);
  function mode() {
    var t = root.getAttribute('data-theme');
    return (t === 'dark' || t === 'light') ? t : (mq.matches ? 'dark' : 'light');
  }
  var back = document.getElementById('back');
  function syncTheme() { var m = mode(); body.setAttribute('data-mode', m); back.href = 'index.html#' + m; }
  document.getElementById('theme').addEventListener('click', function () {
    root.setAttribute('data-theme', mode() === 'dark' ? 'light' : 'dark');
    syncTheme();
  });
  if (mq.addEventListener) mq.addEventListener('change', syncTheme); else if (mq.addListener) mq.addListener(syncTheme);
  syncTheme();

  /* ---------- Gumballs in the dome ---------- */
  var NS = 'http://www.w3.org/2000/svg';
  var ballsG = document.getElementById('balls');
  var seed = 11;
  function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  var list = [];
  for (var y = 222; y > 100; y -= 26) {
    var dy = y - 146;
    var half = Math.sqrt(Math.max(0, 81 * 81 - dy * dy));
    var n = Math.max(1, Math.floor(half * 2 / 31) + 1);
    var gap = n > 1 ? (half * 2) / (n - 1) : 0;
    for (var i = 0; i < n; i++) {
      list.push({ x: 160 - half + i * gap + (rnd() - 0.5) * 4, y: y + (rnd() - 0.5) * 4, c: PICKS[Math.floor(rnd() * PICKS.length)].color });
    }
  }
  list.sort(function (a, b) { return a.y - b.y; });
  list.forEach(function (b) {
    var g = document.createElementNS(NS, 'g');
    g.setAttribute('transform', 'translate(' + b.x.toFixed(1) + ' ' + b.y.toFixed(1) + ')');
    var c = document.createElementNS(NS, 'circle');
    c.setAttribute('r', '15'); c.setAttribute('fill', b.c);
    var s = document.createElementNS(NS, 'circle');
    s.setAttribute('cx', '-5'); s.setAttribute('cy', '-6'); s.setAttribute('r', '3.6');
    s.setAttribute('fill', '#fff'); s.setAttribute('fill-opacity', '0.6');
    g.appendChild(c); g.appendChild(s); ballsG.appendChild(g);
  });
  ballsG.style.transformBox = 'fill-box';
  ballsG.style.transformOrigin = 'center';

  /* ---------- Animation helper ---------- */
  function anim(el, frames, opts) {
    if (reduce || !el.animate) {
      var last = frames[frames.length - 1];
      Object.keys(last).forEach(function (k) { if (k !== 'offset' && k !== 'easing') el.style[k] = last[k]; });
      return Promise.resolve();
    }
    var a = el.animate(frames, { duration: opts.duration, easing: opts.easing || 'ease', fill: 'forwards' });
    return a.finished.then(function () {
      try { a.commitStyles(); } catch (e) {}
      a.cancel();
    }).catch(function () {});
  }

  /* ---------- Game ---------- */
  var knob = document.getElementById('knob');
  var drop = document.getElementById('dropBall');
  var halfTop = document.getElementById('halfTop');
  var halfBot = document.getElementById('halfBot');
  var topPath = document.getElementById('topPath');
  var botPath = document.getElementById('botPath');
  var mainBtn = document.getElementById('main');
  var statusEl = document.getElementById('status');
  var countEl = document.getElementById('count');
  var shelf = document.getElementById('shelf');
  var result = document.getElementById('result');
  var placeholder = document.getElementById('placeholder');

  var state = 'idle'; // idle, rolling, ready, opening, shown
  var found = {};
  var bag = [];
  var current = null;

  function nextPick() {
    if (!bag.length) {
      bag = PICKS.map(function (_, i) { return i; });
      for (var i = bag.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = bag[i]; bag[i] = bag[j]; bag[j] = t; }
    }
    return PICKS[bag.pop()];
  }

  function drawShelf() {
    shelf.textContent = '';
    var n = 0;
    PICKS.forEach(function (p, i) {
      var li = document.createElement('li');
      var d = document.createElement('span'); d.className = 'dot';
      var t = document.createElement('span');
      if (found[i]) { li.className = 'found'; d.style.background = p.color; t.textContent = p.artist; n++; }
      else { t.textContent = '???'; }
      li.appendChild(d); li.appendChild(t); shelf.appendChild(li);
    });
    countEl.textContent = 'Found ' + n + ' of ' + PICKS.length;
    return n;
  }
  drawShelf();

  function setBtn(label, disabled) { mainBtn.textContent = label; mainBtn.disabled = !!disabled; }

  function resetDrop() {
    [drop, halfTop, halfBot].forEach(function (el) { el.style.transform = ''; el.style.opacity = ''; });
    drop.style.opacity = '0';
    drop.classList.remove('ball-wait');
  }

  function roll() {
    state = 'rolling';
    setBtn('Rolling...', true);
    statusEl.textContent = 'Rolling...';
    result.hidden = true; result.classList.remove('show');
    placeholder.hidden = false;
    resetDrop();
    current = nextPick();
    topPath.setAttribute('fill', current.color);
    botPath.setAttribute('fill', current.color);

    var shake = [
      { transform: 'translate(0,0) rotate(0deg)' }, { transform: 'translate(-5px,2px) rotate(-3deg)' },
      { transform: 'translate(5px,-2px) rotate(3deg)' }, { transform: 'translate(-4px,1px) rotate(-2deg)' },
      { transform: 'translate(4px,-1px) rotate(2deg)' }, { transform: 'translate(0,0) rotate(0deg)' }
    ];
    return Promise.all([
      anim(knob, [{ transform: 'rotate(0deg)' }, { transform: 'rotate(360deg)' }], { duration: 900, easing: 'ease-in-out' }),
      anim(ballsG, shake, { duration: 900, easing: 'linear' })
    ]).then(function () {
      return anim(drop, [
        { opacity: 0, transform: 'translateY(-50px) scale(0.5)' },
        { opacity: 1, transform: 'translateY(6px) scale(1)', offset: 0.6 },
        { opacity: 1, transform: 'translateY(-5px) scale(1)', offset: 0.8 },
        { opacity: 1, transform: 'translateY(0) scale(1)' }
      ], { duration: 700, easing: 'ease-in' });
    }).then(function () {
      state = 'ready';
      drop.classList.add('ball-wait');
      setBtn('Open the gumball', false);
      statusEl.textContent = 'A gumball dropped. Tap it to open.';
      mainBtn.focus({ preventScroll: true });
    });
  }

  function openBall() {
    state = 'opening';
    setBtn('Opening...', true);
    drop.classList.remove('ball-wait');
    return Promise.all([
      anim(halfTop, [{ transform: 'translate(0,0) rotate(0deg)', opacity: 1 }, { transform: 'translate(-12px,-34px) rotate(-40deg)', opacity: 0 }], { duration: 550, easing: 'ease-out' }),
      anim(halfBot, [{ transform: 'translate(0,0) rotate(0deg)', opacity: 1 }, { transform: 'translate(12px,14px) rotate(28deg)', opacity: 0 }], { duration: 550, easing: 'ease-out' })
    ]).then(function () {
      var idx = PICKS.indexOf(current);
      found[idx] = true;
      var n = drawShelf();
      document.getElementById('rArt').setAttribute('href', '#' + current.art);
      document.getElementById('rTag').textContent = current.tag;
      document.getElementById('rArtist').textContent = current.artist;
      document.getElementById('rSong').textContent = current.song;
      document.getElementById('rBlurb').textContent = current.blurb;
      document.getElementById('rLink').href = current.link;
      placeholder.hidden = true;
      result.hidden = false;
      void result.offsetWidth;
      result.classList.add('show');
      state = 'shown';
      setBtn('Roll again', false);
      statusEl.textContent = n === PICKS.length ? 'You found all three. Roll again if you want a repeat.' : 'Nice. Roll again for another one.';
      if (!reduce && result.scrollIntoView && window.innerWidth <= 800) result.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    });
  }

  function step() {
    if (state === 'idle' || state === 'shown') return roll();
    if (state === 'ready') return openBall();
  }
  mainBtn.addEventListener('click', step);
  knob.addEventListener('click', function () { if (state === 'idle' || state === 'shown') roll(); });
  drop.addEventListener('click', function () { if (state === 'ready') openBall(); });
})();
</script>
</body>
</html>
